    <script>
    // Definir los usuarios con su código PIN
const users = {
    "8547": "Marlenny León Sánchez",
    "1695": "William León Sánchez",
    "7149": "Elida León Sánchez",
    "1036": "Milciades León Sánchez",
    "4895": "Alejandro León Buitrago", 
    "9031": "Karen Ibague León",        
    "4198": "Yerson León Velazco",
    "1874": "Oscar Hernandez León",
    "1847": "Julian León Velazco",
    "1876": "Salome León Martinez",
    "2398": "Linda Yuleth León",
    "4561": "Wendy Loraine Peña León",
    "1391": "Mary Luz",
    "3218": "Lauren Hernandez León"
};

// Capturar el formulario y la entrada del PIN
const pinForm = document.getElementById("pin-form");
const pinInput = document.getElementById("pin-input");
const errorMessage = document.getElementById("error-message");
const accessScreen = document.getElementById("access-screen");
const mainPage = document.getElementById("main-page");

// Función para verificar el PIN
function verifyPin(event) {
    event.preventDefault(); // Evitar el comportamiento por defecto del formulario

    const enteredPin = pinInput.value.trim();

    // Verificar si el PIN ingresado es válido
    if (users[enteredPin]) {
        // Mostrar el nombre del usuario y notificar en consola
        alert(`¡Bienvenido, ${users[enteredPin]}!`);
        console.log(`${users[enteredPin]} (PIN: ${enteredPin}) ha accedido a la página.`);

        // Ocultar la pantalla de acceso y mostrar la página principal
        accessScreen.style.display = 'none';
        mainPage.style.display = 'block';
    } else {
        // Si el PIN es incorrecto, mostrar mensaje de error
        errorMessage.style.display = 'block';
        pinInput.value = ''; // Limpiar el campo de PIN
    }
}

// Agregar el evento de submit al formulario
pinForm.addEventListener("submit", verifyPin);

// Función para el menú hamburguesa
function toggleMenu() {
    const nav = document.querySelector('nav');
    nav.classList.toggle('active');
}

        </script>
