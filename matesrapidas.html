<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matemáticas Rápidas</title>
    <link rel="shortcut icon" href="img/Logo Familia Leon.png" type="image/x-icon">
    <link rel="stylesheet" href="Mates.css">
</head>
<body>
    <header>
        <h1>Matemáticas Rápidas</h1>
        <p>¡Resuelve las operaciones antes de que se acabe el tiempo!</p>
    </header>
    <main>
        <div id="game-container">
            <div id="question"></div>
            <input type="number" id="answer" placeholder="Tu respuesta" />
            <button id="submit">Responder</button>
            <p id="score">Puntuación: 0</p>
            <p id="timer">Tiempo restante:30</p>


          
        </div>
    </main>
    <footer>
        <p>Desarrollado por [Alejandro León]</p>
    </footer>
    <script src="Mates.js"></script>
</body>
</html>
